[workspace]
resolver = "3"
members = [
    "crates/chronofork-core",
    "crates/chronofork-backend-api",
    "crates/chronofork-sessions",
    "crates/chronofork-trace",
    "crates/chronofork-script",
    "crates/chronofork-service",
    "crates/chronofork-transport",
    "crates/chronofork-debug",
    "crates/chronofork-test-backend",
    "crates/chronofork-megadrive",
    "crates/chronofork-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
chronofork-core = { path = "crates/chronofork-core" }
chronofork-backend-api = { path = "crates/chronofork-backend-api" }
chronofork-sessions = { path = "crates/chronofork-sessions" }
chronofork-trace = { path = "crates/chronofork-trace" }
chronofork-script = { path = "crates/chronofork-script" }
chronofork-service = { path = "crates/chronofork-service" }
chronofork-transport = { path = "crates/chronofork-transport" }
chronofork-debug = { path = "crates/chronofork-debug" }
chronofork-test-backend = { path = "crates/chronofork-test-backend" }
chronofork-megadrive = { path = "crates/chronofork-megadrive" }
proptest = { version = "1.11", default-features = false, features = ["std"] }
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
