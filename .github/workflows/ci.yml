# ChronoFork continuous integration — layered.
#
# Layers (see docs/quality/quality-gates.md § CI and
# .research/consolidation-2026-11-20/reviews/w4-ci.md):
#
#   fast     pull request + push to `main`: format, check/clippy, the core and
#            CPU test groups, plus the deterministic demo contract. These are the
#            jobs a PR is required to pass.
#   nightly  schedule/manual: the full workspace suite in debug *and* release,
#            the single-threaded determinism suite, rustdoc, the declared MSRV,
#            the cross-platform compile check, and — on the pinned self-hosted
#            runner — the commercial-ROM fixture tests and the Exodus oracle
#            differential. `CHRONOFORK_REQUIRE_ROM_FIXTURES=1` and
#            `CHRONOFORK_CROSS_PROFILE_GOLDEN=1` are set on the nightly test
#            contract so a missing fixture, a missing release build or an
#            unprovisioned oracle is an explicit failure, never a green run by
#            absence.
#   release  manual `workflow_dispatch` only: the release build and the
#            release-mode workspace suite.
#
# Every job reuses the same pinned action SHAs and the same cache key scheme.
# Third-party actions are pinned to commit SHAs; bump the SHA together with the
# version comment. No job uses a secret or a credential; the only configuration
# read from the repository (`vars.CHRONOFORK_CI_INFRA`, `vars.CHRONOFORK_ROM_DIR`,
# `vars.CHRONOFORK_ORACLE_ROOT`, `vars.CHRONOFORK_ORACLE_BIN_DIR`) is non-secret.
# When no provisioned runner exists, the fixture and differential jobs are an
# explicit, named skip recorded by `nightly-gate` — the workflow never claims
# coverage it did not run, and it never treats absence as a pass.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # 03:17 UTC on weekdays: after the common dependency-update window, off the
    # :00 stampede that delays cron jobs on shared runners.
    - cron: "17 3 * * 1-5"
  workflow_dispatch:
    inputs:
      nightly:
        description: "Also run the nightly layers on this manual run"
        type: boolean
        default: false
      release:
        description: "Run the release-tagged layer (build + release suite)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  check-clippy:
    name: Check and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-
      - name: cargo check --workspace
        run: cargo check --workspace --locked
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The fast test layer. It runs the two cheap crate groups (core/CPU) and the
  # deterministic demo contract, which is the part of the CLI its own golden test
  # pins. The host/apps groups are nightly-only: their suite is dominated by the
  # ~82 s debug `megadrive demo` run and the service/transport wire tests, which
  # add no signal that the core CPU group does not already give a PR. On a
  # schedule this whole layer is replaced by `test-nightly` over the same code, so
  # no commit is tested twice (the jobs are mutually exclusive by event).
  test-fast:
    name: Test fast (${{ matrix.group }})
    # PR and `main` pushes only. A scheduled run is covered entirely by the
    # nightly layer, which already includes the core and CPU groups: this is the
    # "no duplicated runs" rule of the layering, expressed in the condition rather
    # than by removing the groups from the nightly matrix.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [core, cpu, cli-demo]
    env:
      # `megadrive_demo_output_is_deterministic` swaps the debug binary for the
      # sibling release build. Building that binary is a prerequisite of this
      # job; the explicit golden below still refuses to fake the comparison.
      CHRONOFORK_CROSS_PROFILE_GOLDEN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-
      # Building the release CLI is required by the cross-profile golden, so it
      # belongs to this layer regardless of which matrix group runs it.
      - name: Build the CLI (release, for the cross-profile golden)
        run: cargo build -p chronofork-cli --release --locked
      - name: cargo test (fast crate group)
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -o pipefail
          mkdir -p ci-artifacts
          case "$GROUP" in
            core) packages=(-p chronofork-core -p chronofork-backend-api -p chronofork-test-backend) ;;
            cpu) packages=(-p chronofork-megadrive) ;;
            cli-demo) packages=(-p chronofork-cli) ;;
            *) echo "::error::unknown fast test group $GROUP"; exit 1 ;;
          esac
          cargo test "${packages[@]}" --locked --no-fail-fast 2>&1 | tee "ci-artifacts/test-fast-${GROUP}.log"
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-log-linux-fast-${{ matrix.group }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 7

  # ── nightly layer ────────────────────────────────────────────────────────────

  test-nightly:
    name: Test nightly (${{ matrix.group }})
    if: github.event_name == 'schedule' || inputs.nightly == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [core, cpu, host, apps]
    env:
      # The nightly contract: a missing release build must fail rather than let
      # the demo golden compare itself twice, and a missing commercial-ROM fixture
      # must fail in the fixture groups below. Both variables are flipped here and
      # only here.
      CHRONOFORK_CROSS_PROFILE_GOLDEN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-
      - name: Build the CLI (release, for the cross-profile golden)
        run: cargo build -p chronofork-cli --release --locked
      - name: cargo test (crate group)
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -o pipefail
          mkdir -p ci-artifacts
          case "$GROUP" in
            core) packages=(-p chronofork-core -p chronofork-backend-api -p chronofork-test-backend) ;;
            cpu) packages=(-p chronofork-megadrive) ;;
            host) packages=(-p chronofork-sessions -p chronofork-debug -p chronofork-trace -p chronofork-script) ;;
            apps) packages=(-p chronofork-service -p chronofork-transport -p chronofork-gui -p chronofork-cli) ;;
            *) echo "::error::unknown test group $GROUP"; exit 1 ;;
          esac
          cargo test "${packages[@]}" --locked --no-fail-fast 2>&1 | tee "ci-artifacts/test-nightly-${GROUP}.log"
      - name: Determinism suite, single-threaded
        if: matrix.group == 'host'
        shell: bash
        run: |
          set -o pipefail
          cargo test -p chronofork-sessions --test determinism --locked -- --test-threads=1 2>&1 | tee -a "ci-artifacts/test-nightly-host.log"
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-log-linux-nightly-${{ matrix.group }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

  docs-nightly:
    name: Rustdoc (nightly)
    if: github.event_name == 'schedule' || inputs.nightly == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-
      - name: cargo doc with denied warnings
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

  msrv-nightly:
    name: MSRV 1.85.0 build check (nightly)
    if: github.event_name == 'schedule' || inputs.nightly == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-
      - name: cargo check with the declared MSRV
        env:
          RUSTUP_TOOLCHAIN: "1.85.0"
        run: cargo check --workspace --all-targets --locked

  portability-nightly:
    name: Build check ${{ matrix.os }} (nightly)
    if: github.event_name == 'schedule' || inputs.nightly == true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-
      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets --locked

  demos:
    name: Deterministic demos (nightly)
    # Restored in the nightly layer rather than the fast one: the pinned cross-profile
    # golden already covers the megadrive demo bytes on every PR, while the extra
    # evidence here is the repeat-run identity of *both* demos plus the plain demo's
    # PASS marker, which no Rust test asserts.
    if: github.event_name == 'schedule' || inputs.nightly == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
      # The release binary is used because every debug step hashes the full
      # machine state (64 KiB RAM + 64 KiB VRAM), which makes the demo ~7x
      # slower without changing its output: the demo output is profile-independent
      # (the debug/text fixtures are byte-identical), so release keeps the check
      # honest while cutting the job's runtime.
      - name: Build the CLI (release)
        run: cargo build -p chronofork-cli --release --locked
      - name: Run each demo three times and compare bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/demos
          binary=target/release/chronofork

          run_demo() {
            local slug="$1"
            local marker="$2"
            shift 2
            local run
            for run in 1 2 3; do
              "$binary" "$@" \
                >"ci-artifacts/demos/${slug}-run${run}.stdout" \
                2>"ci-artifacts/demos/${slug}-run${run}.stderr"
              if [ -s "ci-artifacts/demos/${slug}-run${run}.stderr" ]; then
                echo "::error::${slug} run ${run} wrote to stderr"
                cat "ci-artifacts/demos/${slug}-run${run}.stderr"
                exit 1
              fi
            done
            cmp "ci-artifacts/demos/${slug}-run1.stdout" "ci-artifacts/demos/${slug}-run2.stdout"
            cmp "ci-artifacts/demos/${slug}-run1.stdout" "ci-artifacts/demos/${slug}-run3.stdout"
            grep -Fq "$marker" "ci-artifacts/demos/${slug}-run1.stdout"
          }

          run_demo demo "chronofork demo: PASS" demo
          run_demo megadrive-demo "chronofork megadrive demo: PASS" megadrive demo
      - name: Upload demo outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-outputs
          path: ci-artifacts/demos/
          if-no-files-found: warn
          retention-days: 7

  # ── nightly evidence layer: fixtures and the pinned differential ─────────────
  #
  # Both jobs need data that cannot live in the repository: commercial ROM images
  # and the pinned Exodus checkout/build. They therefore run only on a
  # self-hosted runner registered with the labels below, and only when the
  # non-secret repository variable `CHRONOFORK_CI_INFRA` is `provisioned`. Both
  # variables below are set, so the fixture tests and the differential fail loudly
  # if their inputs are missing — a runner that claims to be provisioned and is
  # not turns the nightly red instead of producing a green run by absence.
  #
  # Without that runner this job is an explicit, named skip: the nightly is known
  # to cover everything except the commercial-ROM fixture tests and the pinned
  # Exodus differential, and `.research/consolidation-2026-11-20/reviews/w4-ci.md`
  # records exactly that gap plus the recipe to close it.

  fixtures:
    name: ROM fixtures (commercial images, pinned runner)
    if: (github.event_name == 'schedule' || inputs.nightly == true) && vars.CHRONOFORK_CI_INFRA == 'provisioned'
    runs-on: [self-hosted, linux, chronofork-nightly]
    timeout-minutes: 30
    env:
      # Contract from W4.5: a run that sets this claims the fixtures exist, so a
      # fixture test can no longer pass with zero assertions.
      CHRONOFORK_REQUIRE_ROM_FIXTURES: "1"
      CHRONOFORK_CROSS_PROFILE_GOLDEN: "1"
      CHRONOFORK_ROM_DIR: ${{ vars.CHRONOFORK_ROM_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-
      - name: Assert the provisioned runner really has the fixtures
        shell: bash
        run: |
          # Same lookup order the fixture tests use (`chronofork_megadrive::test_support::rom_path`):
          # $CHRONOFORK_ROM_DIR, then the shared absolute path, then the workspace tree.
          # The assertion is deliberately wider than the lookup: it can only fail,
          # never rescue, a runner that claims to be provisioned while the fixture
          # tests would report the ROM absent.
          set -euo pipefail
          missing=0
          for name in "Chakan (USA, Europe).bin" "Kid Chameleon (USA, Europe).bin"; do
            found=""
            for dir in "${CHRONOFORK_ROM_DIR:-}" "${HOME:-}/projects/ChronoFork/.research/roms" "${GITHUB_WORKSPACE:-}/.research/roms"; do
              if [ -n "$dir" ] && [ -f "$dir/$name" ]; then
                found="$dir/$name"
                break
              fi
            done
            if [ -z "$found" ]; then
              echo "::error::runner claims CHRONOFORK_CI_INFRA=provisioned but $name is absent from every documented location"
              missing=1
            else
              echo "fixture present: $found"
            fi
          done
          exit "$missing"
      - name: Build the CLI (release, for the cross-profile golden)
        run: cargo build -p chronofork-cli --release --locked
      - name: Fixture-backed cartridge tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts
          cargo test -p chronofork-megadrive --test cartridge --locked --no-fail-fast 2>&1 | tee ci-artifacts/fixtures-cartridge.log
          # The fixture set hashed and accounted for; never a silent pass.
          cargo test -p chronofork-megadrive --test fixture_integrity --locked --no-fail-fast 2>&1 | tee -a ci-artifacts/fixtures-cartridge.log
      - name: Upload fixture-evidence log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-evidence
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 30

  differential:
    name: Exodus differential (pinned oracle)
    if: (github.event_name == 'schedule' || inputs.nightly == true) && vars.CHRONOFORK_CI_INFRA == 'provisioned'
    runs-on: [self-hosted, linux, chronofork-nightly]
    timeout-minutes: 90
    env:
      CHRONOFORK_ORACLE_ROOT: ${{ vars.CHRONOFORK_ORACLE_ROOT }}
      CHRONOFORK_ORACLE_BIN_DIR: ${{ vars.CHRONOFORK_ORACLE_BIN_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-oracle-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-oracle-
      # One run, not two: `--require-oracle` is itself the preflight (it exits 3
      # before building or writing evidence when the pinned oracle is absent), and
      # a second `--oracle-status` invocation would only re-hash the same binaries.
      #
      # Exit codes are handled explicitly instead of being left to `set -o pipefail`:
      #   0 -> the corpus matches
      #   1 -> a trace/cycle/final-state divergence: a real finding, must fail
      #   3 -> the pinned oracle is not provisioned on a runner that claims
      #        CHRONOFORK_CI_INFRA=provisioned: must also fail, and is named as a
      #        provisioning failure rather than reported as a divergence
      #   2 -> harness/setup error: fail
      - name: Pinned differential over the whole ROM corpus
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts
          python3 scripts/oracle-diff.py --require-oracle --out-dir ci-artifacts/oracle 2>&1 \
            | tee ci-artifacts/oracle-diff.log
          code=${PIPESTATUS[0]}
          case "$code" in
            0) echo "differential: the whole corpus matches" ;;
            1) echo "::error::the pinned differential reported a DIVERGENCE (exit 1); this is a finding, not a skip" ;;
            3) echo "::error::the pinned oracle is not provisioned on a runner that claims CHRONOFORK_CI_INFRA=provisioned (exit 3); see .research/oracle/README.md" ;;
            *) echo "::error::the differential harness failed with exit $code" ;;
          esac
          exit "$code"
      - name: Provisioned-oracle branch of the harness test target
        shell: bash
        run: |
          set -o pipefail
          # The target's default run reports this test as `ignored`; the documented
          # recipe runs it explicitly once the oracle exists. Running it here means
          # the harness test itself is exercised against a real oracle, so the
          # ignored test is not an unexercised branch of the target.
          cargo test -p chronofork-megadrive --test oracle_harness --locked -- --ignored 2>&1 | tee -a ci-artifacts/oracle-diff.log
      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-differential-evidence
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 30

  nightly-gate:
    name: Nightly evidence gate
    # Positive evidence beats a vacuous pass: the job runs exactly on the nightly
    # layer and fails if the fixtures job or the differential did not succeed.
    # `always()` is required so a skipped/failed dependency is visible here instead
    # of leaving the workflow green.
    needs: [fixtures, differential]
    if: always() && (github.event_name == 'schedule' || inputs.nightly == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both evidence jobs to have succeeded
        shell: bash
        env:
          FIXTURES_RESULT: ${{ needs.fixtures.result }}
          DIFFERENTIAL_RESULT: ${{ needs.differential.result }}
          INFRA: ${{ vars.CHRONOFORK_CI_INFRA }}
        run: |
          set -euo pipefail
          echo "fixtures=$FIXTURES_RESULT differential=$DIFFERENTIAL_RESULT infra=${INFRA:-<unset>}"
          if [ "${INFRA:-}" != "provisioned" ]; then
            echo "::warning::CHRONOFORK_CI_INFRA is not 'provisioned', so the commercial-ROM fixture tests and the pinned Exodus differential did NOT run in this nightly. This is an explicit, named gap (docs/quality/quality-gates.md), not a pass."
            exit 0
          fi
          if [ "$FIXTURES_RESULT" != "success" ] || [ "$DIFFERENTIAL_RESULT" != "success" ]; then
            echo "::error::provisioned nightly must have successful fixture and differential jobs (fixtures=$FIXTURES_RESULT differential=$DIFFERENTIAL_RESULT)"
            exit 1
          fi

  # ── release layer (manual only) ──────────────────────────────────────────────

  release:
    name: Release build and tests
    if: github.event_name == 'workflow_dispatch' && inputs.release == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHRONOFORK_CROSS_PROFILE_GOLDEN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
      - name: cargo build --workspace --release
        run: cargo build --workspace --release --locked
      # The release suite already has the release binary; the debug sibling is
      # needed for the debug side of the cross-profile golden.
      - name: cargo build --workspace (debug, for the cross-profile golden)
        run: cargo build --workspace --locked
      - name: cargo test --workspace --release
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts
          cargo test --workspace --release --locked --no-fail-fast 2>&1 | tee ci-artifacts/release-test.log
      - name: Upload release test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-log
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 30
