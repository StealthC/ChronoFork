# ChronoFork continuous integration.
#
# Triggered by pushes to `main` and by pull requests. Branch pushes do not run
# the workflow (the pull request is the check for a branch) and superseded PR
# runs are cancelled, so each commit is validated once. The Rust commands mirror
# scripts/check.sh; the workspace tests are split into crate groups so the
# critical path is shorter. Extra jobs cover release mode, the deterministic
# demo contract (run from the release binary), the declared MSRV and a
# cross-platform compile check. Third-party actions are pinned to commit SHAs;
# bump the SHA together with the version comment.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  check-clippy:
    name: Check and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-
      - name: cargo check --workspace
        run: cargo check --workspace --locked
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [core, cpu, host, apps]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-
      - name: cargo test (crate group)
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -o pipefail
          mkdir -p ci-artifacts
          case "$GROUP" in
            core) packages=(-p chronofork-core -p chronofork-backend-api -p chronofork-test-backend) ;;
            cpu) packages=(-p chronofork-megadrive) ;;
            host) packages=(-p chronofork-sessions -p chronofork-debug -p chronofork-trace -p chronofork-script) ;;
            apps) packages=(-p chronofork-service -p chronofork-transport -p chronofork-gui -p chronofork-cli) ;;
            *) echo "::error::unknown test group $GROUP"; exit 1 ;;
          esac
          cargo test "${packages[@]}" --locked --no-fail-fast 2>&1 | tee ci-artifacts/test.log
      - name: Determinism suite, single-threaded
        if: matrix.group == 'host'
        shell: bash
        run: |
          set -o pipefail
          cargo test -p chronofork-sessions --test determinism --locked -- --test-threads=1 2>&1 | tee -a ci-artifacts/test.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-log-linux-${{ matrix.group }}
          path: ci-artifacts/test.log
          if-no-files-found: warn
          retention-days: 7

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-
      - name: cargo doc with denied warnings
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

  demos:
    name: Deterministic demos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
      # The release binary is used because every debug step hashes the full
      # machine state (64 KiB RAM + 64 KiB VRAM), which makes the demo ~7x
      # slower without changing its output: the demo output is profile-independent
      # (the debug/text fixtures are byte-identical), so release keeps the check
      # honest while cutting the job's runtime.
      - name: Build the CLI (release)
        run: cargo build -p chronofork-cli --release --locked
      - name: Run each demo three times and compare bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/demos
          binary=target/release/chronofork

          run_demo() {
            local slug="$1"
            local marker="$2"
            shift 2
            local run
            for run in 1 2 3; do
              "$binary" "$@" \
                >"ci-artifacts/demos/${slug}-run${run}.stdout" \
                2>"ci-artifacts/demos/${slug}-run${run}.stderr"
              if [ -s "ci-artifacts/demos/${slug}-run${run}.stderr" ]; then
                echo "::error::${slug} run ${run} wrote to stderr"
                cat "ci-artifacts/demos/${slug}-run${run}.stderr"
                exit 1
              fi
            done
            cmp "ci-artifacts/demos/${slug}-run1.stdout" "ci-artifacts/demos/${slug}-run2.stdout"
            cmp "ci-artifacts/demos/${slug}-run1.stdout" "ci-artifacts/demos/${slug}-run3.stdout"
            grep -Fq "$marker" "ci-artifacts/demos/${slug}-run1.stdout"
          }

          run_demo demo "chronofork demo: PASS" demo
          run_demo megadrive-demo "chronofork megadrive demo: PASS" megadrive demo
      - name: Upload demo outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-outputs
          path: ci-artifacts/demos/
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Release build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
      - name: cargo build --workspace --release
        run: cargo build --workspace --release --locked
      - name: cargo test --workspace --release
        run: cargo test --workspace --release --locked --no-fail-fast

  msrv:
    name: MSRV 1.85.0 build check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-
      - name: cargo check with the declared MSRV
        env:
          RUSTUP_TOOLCHAIN: "1.85.0"
        run: cargo check --workspace --all-targets --locked

  portability:
    name: Build check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-
      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets --locked
